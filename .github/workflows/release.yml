name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.0", cache: npm }
      - run: npm ci
      - run: npm run check && npm test
      - name: Verify tag and build portable service bundle
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          test "${version}" = "${package_version}"
          mkdir -p dist
          tar --exclude=node_modules --exclude=dist -czf "dist/zidane-agent-${version}.tar.gz" package.json package-lock.json src services scripts README.md Dockerfile
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
