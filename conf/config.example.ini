[agent]
# Display name in the Zidane UI. Defaults to the hostname.
name = MY-MACHINE

# Maximum number of tasks this agent runs at once. Zidane schedules by slots, so a
# capacity of 4 means four independent steps can run here concurrently.
capacity = 4

# Comma-separated key=value labels. A workflow step only lands on agents whose labels
# satisfy its selector, and scripts declare the labels they require.
labels = os=linux, template=LINUX_ABA

auto_upgrade = true
upgrade_channel = stable

# Persisted agent state: session token, machine_version, command journal.
state_dir = state

# Root for per-task working directories.
workdir_root = work

[backend]
# This section is NOT remotely writable — a backend push cannot repoint the fleet.
wss_url = wss://zidane.example.com:17001/ws/agent
api_key = replace-with-a-zidane-user-token

# [rest]
# Reserved for the agent's local REST API — the loopback endpoint a script on this host
# calls to read or update its machine_version. NOT IMPLEMENTED YET; the port is recorded
# here so nothing else in the project claims it.
# host = 127.0.0.1
# port = 17002

[logging]
file = logs/agent.log
level = INFO

# Rotation: max_mb per file, and file_count files kept including the live one — so the
# defaults below cap the agent log at 250MB.
max_mb = 50
file_count = 5
